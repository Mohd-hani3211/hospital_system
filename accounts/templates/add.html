{% extends "base.html" %}

{% block title %}

<span class="title"> {{ title }} </span>

{% endblock title %}

{% block content %}
<div class="card">
    <div class="card-header card-header-primary"><h4 class="card-title">{{ title|default:"اضافة" }} </h4></div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    <small class="text-danger">{{ field.errors.0 }}</small>
                </div>
                {% endfor %}
            </div>

            <div class="text-center">
                <button type="submit" class="btn  btn-primary"> حفظ</button>
            </div>
        </form>
    </div>
</div>


<script>
document.addEventListener("DOMContentLoaded", function() {

    console.log("add NR maintenance modal")
        {% if request.user.profile.managing_department  %}
        console.log("Managing Department ID: {{request.user.profile.managing_department.id}}")
            var depId = "{{request.user.profile.managing_department.id}}"
            $('#department-field').val(depId).trigger('change');
            $('#department-field').attr('disabled',true);

        {% elif not request.user.profile.managing_department and effective_permissions.is_department_manager %}
        
            $('#department-field').attr('disabled',true);

        {% endif %}
});
</script>

    
{% endblock %}
