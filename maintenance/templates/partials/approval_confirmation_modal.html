<div class="modal fade" id="approvalConfirmModal" tabindex="-1" role="dialog" aria-labelledby="approvalConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" dir="rtl">
            <form id="approval-confirm-form" method="POST" action="">
                {% csrf_token %}
                <input type="hidden" name="approval_mode" id="approval-confirm-mode" value="">
                <input type="hidden" id="approval-confirm-extra-action" value="">

                <div class="modal-header border-bottom">
                    <h5 class="modal-title font-weight-bold" id="approvalConfirmModalLabel">تأكيد التعميد</h5>
                    <button type="button" class="close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body text-right">
                    <p id="approval-confirm-text" class="text-dark font-weight-bold mb-3"></p>

                    <div class="border rounded p-3 mb-3 bg-light">
                        <div class="row">
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">المستخدم الحالي</small>
                                <strong id="approval-confirm-user"></strong>
                            </div>
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">المسمى الوظيفي الحالي</small>
                                <strong id="approval-confirm-user-title"></strong>
                            </div>
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">نوع الإجراء</small>
                                <strong id="approval-confirm-workflow"></strong>
                            </div>
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">رقم الطلب / التقرير</small>
                                <strong id="approval-confirm-subject"></strong>
                            </div>
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">مستوى التعميد المطلوب</small>
                                <strong id="approval-confirm-level"></strong>
                            </div>
                            <div class="col-sm-6 mb-2">
                                <small class="text-muted d-block">المسمى المطلوب منه التعميد</small>
                                <strong id="approval-confirm-required-title"></strong>
                            </div>
                        </div>
                    </div>

                    <div id="approval-confirm-delegated-note" class="alert alert-warning mb-0 d-none">
                        <div class="font-weight-bold mb-1">سيتم تسجيل هذا التعميد كتعميد نيابة.</div>
                        <div id="approval-confirm-employees-wrapper" class="mt-2 d-none">
                            <small class="d-block font-weight-bold">الأشخاص أصحاب هذا المستوى:</small>
                            <span id="approval-confirm-employees"></span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" data-bs-dismiss="modal">إلغاء</button>
                    <button type="submit" class="btn btn-success" id="approval-confirm-submit">تأكيد التعميد</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var modal = document.getElementById("approvalConfirmModal");
    var form = document.getElementById("approval-confirm-form");
    if (!modal || !form) {
        return;
    }

    var fields = {
        mode: document.getElementById("approval-confirm-mode"),
        extraAction: document.getElementById("approval-confirm-extra-action"),
        title: document.getElementById("approvalConfirmModalLabel"),
        text: document.getElementById("approval-confirm-text"),
        user: document.getElementById("approval-confirm-user"),
        userTitle: document.getElementById("approval-confirm-user-title"),
        workflow: document.getElementById("approval-confirm-workflow"),
        subject: document.getElementById("approval-confirm-subject"),
        level: document.getElementById("approval-confirm-level"),
        requiredTitle: document.getElementById("approval-confirm-required-title"),
        delegatedNote: document.getElementById("approval-confirm-delegated-note"),
        employeesWrapper: document.getElementById("approval-confirm-employees-wrapper"),
        employees: document.getElementById("approval-confirm-employees"),
        submit: document.getElementById("approval-confirm-submit")
    };

    function setText(element, value) {
        if (element) {
            element.textContent = value || "";
        }
    }

    document.querySelectorAll(".open-approval-confirmation").forEach(function(button) {
        button.addEventListener("click", function() {
            var mode = button.dataset.approvalMode || "";
            var extraAction = button.dataset.extraAction || "";
            form.action = button.dataset.actionUrl || "";
            fields.mode.value = mode;
            fields.extraAction.name = extraAction ? "action" : "";
            fields.extraAction.value = extraAction;

            setText(fields.title, button.dataset.modalTitle || "تأكيد التعميد");
            setText(fields.text, button.dataset.confirmationText || "");
            setText(fields.user, button.dataset.currentUserName || "");
            setText(fields.userTitle, button.dataset.currentUserJobTitle || "");
            setText(fields.workflow, button.dataset.workflowLabel || "");
            setText(fields.subject, "#" + (button.dataset.subjectNumber || ""));
            setText(fields.level, button.dataset.requiredLevel || "");
            setText(fields.requiredTitle, button.dataset.requiredJobTitle || "");
            setText(fields.employees, button.dataset.requiredEmployeeNames || "");
            setText(fields.submit, button.dataset.confirmLabel || "تأكيد التعميد");

            if (mode === "delegated") {
                fields.delegatedNote.classList.remove("d-none");
                fields.submit.classList.remove("btn-success");
                fields.submit.classList.add("btn-warning");
                if (button.dataset.requiredEmployeeNames) {
                    fields.employeesWrapper.classList.remove("d-none");
                } else {
                    fields.employeesWrapper.classList.add("d-none");
                }
            } else {
                fields.delegatedNote.classList.add("d-none");
                fields.employeesWrapper.classList.add("d-none");
                fields.submit.classList.remove("btn-warning");
                fields.submit.classList.add("btn-success");
            }
        });
    });
});
</script>
