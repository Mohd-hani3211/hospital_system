{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header card-header-primary"><h4 class="card-title">إضافة مبنى</h4></div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <h5 class="info-text">ادخال بيانات المبنى</h5>
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    <small class="text-danger">{{ field.errors.0 }}</small>
                </div>
                {% endfor %}
            </div>

            <div class="text-center">
                <button type="submit" class="btn  btn-primary">حفظ المبنى</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
